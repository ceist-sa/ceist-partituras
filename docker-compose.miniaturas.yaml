# The thumbnails trial, next to the site itself: the image of the "miniaturas" branch at
# miniaturas.ceist.pt. Uses the same .env as docker-compose.yaml.
services:
  partituras-miniaturas:
    container_name: ceist-partituras-miniaturas
    image: ghcr.io/ceist-sa/ceist-partituras:miniaturas
    pull_policy: always
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: miniaturas.ceist.pt
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  caddy:
    external: true
